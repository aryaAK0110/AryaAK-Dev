<style>
:root{--bg:#F3F5FB;--ink:#1C2541;--muted:#5A6385;--line:#D5DAEA;--card:#FFFFFF;--on:#1C2541;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14182B;--ink:#ECEFFA;--muted:#A3ABCB;--line:#2B3150;--card:#1C2140;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:1.15rem;line-height:1.65;padding:env(safe-area-inset-top,0px) 1.25rem calc(4rem + env(safe-area-inset-bottom,0px))}
main{max-width:44rem;margin:0 auto}
h1,h2,h3,button,.sans{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.top{display:flex;justify-content:flex-end;align-items:center;gap:.5rem;flex-wrap:wrap;padding-top:.8rem;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.85rem;color:var(--muted)}
.cover{display:grid;place-items:center;width:100%;aspect-ratio:16/7;margin-top:.8rem;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;color:var(--muted);font-size:.9rem;cursor:default}
.cover img{width:100%;height:100%;object-fit:cover}
body.dev .cover{cursor:pointer}
header.hascover{padding-top:0}
header.hascover .avatar{margin-top:-3.25rem;border:4px solid var(--bg);position:relative;z-index:1}
body.dev [data-k]:empty::before{content:"(ketuk untuk mengisi)";color:var(--muted);font-size:.9em}
[data-k="about"],[data-k="terms"],[data-k="priv"],[data-k="vipD"],[data-k="tag"],[data-k="vipPay"]{white-space:pre-line}
.pk2h{font-size:1.15rem;margin:1.2rem 0 .6rem}
.gal{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:.8rem;border-radius:10px}
.gal img{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--line)}

.pkgs{display:grid;gap:.8rem;margin:1rem 0}

.pp{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;margin:.2rem 0 .4rem}
.pd{color:var(--muted);font-size:.95rem;margin:.5rem 0 .8rem;white-space:pre-line}
.main-btn.sm{padding:.45rem 1rem;font-size:.9rem}

.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fl select{width:100%;font:inherit;font-size:1rem;padding:.6rem .75rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

.req select{font:inherit;font-size:.9rem;padding:.3rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(32rem,100%);max-height:92vh;overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px))}

.fl{display:block;margin-bottom:.9rem}
.fl span{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.25rem}
.fl input,.fl textarea{width:100%;font:inherit;font-size:1rem;padding:.6rem .75rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sa{display:flex;gap:.6rem;align-items:center;margin-top:1rem}
.sa .sp{flex:1}
.sa .cancel{background:transparent;color:var(--ink);border:1px solid var(--line)}
.crop{display:block;margin:0 auto .8rem;border-radius:12px;touch-action:none;cursor:grab;max-width:100%}
.crop.round{border-radius:50%}
input[type=range]{width:100%}
.note{font-size:.95rem;color:var(--muted);margin:.5rem 0}
.err{font-size:.95rem;color:#C0392B;margin:.5rem 0}
.stars{font-size:1.1rem;letter-spacing:.1em;color:#E8A800}
.rev{margin-top:.7rem;padding:.7rem .9rem;border:1px dashed var(--line);border-radius:10px;font-size:1rem}
.rev p{margin:.3rem 0 .6rem}
.chip.rated{background:#FFC53D;color:#1C2541}
.note-s{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.starpick{display:flex;gap:.3rem;margin:.4rem 0 1rem}
.star{font-size:2rem;line-height:1;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:.1rem .2rem}
.star.on{color:#E8A800}
.chat{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem;padding:.2rem}
.msg{max-width:85%;padding:.5rem .8rem;border-radius:14px;font-size:1rem;line-height:1.45;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#FFC53D;color:#1C2541;border-color:transparent}
.msg small{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.7rem;opacity:.7;margin-bottom:.15rem}
.bell{position:relative;display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.dot{position:absolute;top:-.35rem;right:-.35rem;min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:999px;background:#E5484D;color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.ni{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin-bottom:.6rem;cursor:pointer}
.ni.unread{border-color:#FFC53D;box-shadow:inset 3px 0 0 #FFC53D}
.ni small{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.75rem;color:var(--muted);margin-top:.2rem}
.chip.new{background:#E5484D;color:#fff;margin-left:.3rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:60;max-width:90%;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:.9rem}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyA4TncTjWI3shVkIAygnx1e5pCnZk5eSN4",
  authDomain:"aryaak-dev.firebaseapp.com",
  projectId:"aryaak-dev",
  storageBucket:"aryaak-dev.firebasestorage.app",
  messagingSenderId:"415268290480",
  appId:"1:415268290480:web:edca73f27e4febd1bee075"
});
const auth=getAuth(app),db=getFirestore(app);

const DEF={texts:{name:'Nama Kamu',role:'Pekerjaan atau minat utama',tag:'Tulis satu kalimat tentang dirimu di sini.',aboutH:'Tentang saya',about:'Ceritakan dirimu secara singkat: siapa kamu, apa yang kamu kerjakan, dan apa yang kamu sukai.',projH:'Karya dan proyek',vipH:'Request VIP',vipD:'Mau dibuatkan karya khusus atau butuh prioritas? Kirim request VIP dan aku balas lebih dulu.',vipP:'Mulai Rp 50.000',vipPay:'Isi nama bank atau e-wallet, nomor, dan nama pemilik.',vipWa:'',contH:'Kontak',pk2H:'Paket baru',vipPkH:'Paket VIP',testiH:'Testimoni',termsH:'Syarat dan ketentuan',terms:'',priv:''},
  contacts:[{l:'Email',h:'mailto:namamu@email.com'},{l:'Instagram',h:'https://instagram.com/'}],photo:'',cover:'',packages:[],packages2:[],vipPackages:[],testi:[]};

const clone=o=>JSON.parse(JSON.stringify(o));

let FILTER='semua',S=clone(DEF),P=[],U=null,DEV=false,REQ=[],unReq=null,NOTES=[],unNote=null,REV=[],PUB=[],unRev=null;

/* data */
function norm(d){const x=clone(DEF);x.texts=Object.assign(x.texts,d.texts||{});x.contacts=d.contacts||x.contacts;x.photo=d.photo||'';x.cover=d.cover||'';x.open=d.open!==false;x.packages=Array.isArray(d.packages)?d.packages:[];x.packages2=Array.isArray(d.packages2)?d.packages2:[];x.vipPackages=Array.isArray(d.vipPackages)?d.vipPackages:[];x.testi=Array.isArray(d.testi)?d.testi:[];return x}
async function saveMain(){try{await setDoc(doc(db,'site','main'),S)}catch(e){toast('Gagal menyimpan: '+(e.code||e.message))}}
onSnapshot(doc(db,'site','main'),s=>{S=s.exists()?norm(s.data()):clone(DEF);renderTexts();renderPhoto();renderCover();renderPkgs();renderOpen();renderTesti();renderContacts()},()=>{});

onSnapshot(query(collection(db,'reviews'),where('show','==',true)),s=>{PUB=s.docs.map(d=>Object.assign({id:d.id},d.data()));PUB.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));renderTesti()},()=>{});

/* auth */
const provider=new GoogleAuthProvider();
async function login(){try{await signInWithPopup(auth,provider)}catch(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Gagal masuk: '+(e.code||e.message))}}
$('auth').onclick=()=>U?signOut(auth):login();

  U=u;DEV=false;

      NOTES.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));

  }

let pickCb=null;const fi=$('fi');
const pick=cb=>{pickCb=cb;fi.value='';fi.click()};
fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f||!pickCb)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>pickCb(im);im.src=r.result};r.readAsDataURL(f)};
function openCrop(img,asp,outW,title,onDone,opts){
  opts=opts||{};
  const W=Math.min(320,window.innerWidth-72),H=Math.round(W/asp),outH=Math.round(outW/asp);
  const body=mk('div'),cv=mk('canvas','crop'+(asp===1?' round':''));cv.width=W;cv.height=H;
  const rg=document.createElement('input');rg.type='range';rg.step='any';rg.setAttribute('aria-label','Perbesar atau perkecil');
  const cover=Math.max(W/img.width,H/img.height),fit=Math.min(W/img.width,H/img.height);
  rg.min=fit;rg.max=cover*3;rg.value=cover;
  let s=cover,ox=(W-img.width*s)/2,oy=(H-img.height*s)/2,drag=null;const ctx=cv.getContext('2d');
  const clamp=()=>{const iw=img.width*s,ih=img.height*s;
    ox=iw>=W?Math.min(0,Math.max(W-iw,ox)):Math.min(W-iw,Math.max(0,ox));
    oy=ih>=H?Math.min(0,Math.max(H-ih,oy)):Math.min(H-ih,Math.max(0,oy))};
  const draw=(c,k)=>{c.fillStyle='#E9ECF5';c.fillRect(0,0,W*k,H*k);c.drawImage(img,ox*k,oy*k,img.width*s*k,img.height*s*k)};
  const paint=()=>{clamp();draw(ctx,1)};
  rg.addEventListener('input',()=>{const cx=(W/2-ox)/s,cy=(H/2-oy)/s;s=+rg.value;ox=W/2-cx*s;oy=H/2-cy*s;paint()});
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag)return;ox=drag.ox+e.clientX-drag.x;oy=drag.oy+e.clientY-drag.y;paint()});
  cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
  body.append(cv,rg,mk('p','note','Geser gambar untuk mengatur posisi. Geser slider untuk memperbesar atau memperkecil.'));
  paint();
  openSheet({title,body,ok:'Pakai foto',noFocus:true,del:!!opts.onDel,delLabel:'Hapus foto',onDel:opts.onDel,onCancel:opts.onBack,
    onOk(){const out=document.createElement('canvas');out.width=outW;out.height=outH;draw(out.getContext('2d'),outW/W);onDone(out.toDataURL('image/jpeg',0.8))}});
}

const imgsOf=p=>Array.isArray(p.imgs)?p.imgs:(p.img?[p.img]:[]);
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function galStep(g){return g.children.length>1?(g.children[1].offsetLeft-g.children[0].offsetLeft)||g.clientWidth:g.clientWidth}
function wireGallery(g,d){
  const n=g._n;
  const hold=()=>{g._pause=Date.now()+8000};
  ['pointerdown','touchstart','wheel'].forEach(t=>g.addEventListener(t,hold,{passive:true}));
  g.addEventListener('mouseenter',()=>{g._hover=true});
  g.addEventListener('mouseleave',()=>{g._hover=false});
  g.addEventListener('scroll',()=>{
    const s=galStep(g),i=Math.round(g.scrollLeft/s);
    [...d.children].forEach((x,k)=>x.classList.toggle('on',k===i%n));
    clearTimeout(g._jt);
    if(i>=n)g._jt=setTimeout(()=>{g.scrollLeft=0},160);
  },{passive:true});
}
function autoGallery(){
  if(document.hidden||!ov.hidden)return;
  document.querySelectorAll('.gal').forEach(g=>{
    if(g.children.length<2||g._hover||(g._pause||0)>Date.now())return;
    const r=g.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
    const s=galStep(g),n=g._n;let i=Math.round(g.scrollLeft/s);
    if(i>=n){g.scrollLeft=0;i=0}
    g.scrollTo({left:(i+1)*s,behavior:'smooth'});
  });
}

  openSheet({title:'Chat request',body,ok:'Kirim',cancelLabel:'Tutup',noFocus:true,onCancel:stop,
    onOk(){
      const t=f.input.value.trim();if(!t)return false;
      if(t.length>1000){err.textContent='Pesan terlalu panjang (maksimal 1000 huruf).';return false}
      err.textContent='';sOk.disabled=true;
      addDoc(collection(db,'requests',r.id,'messages'),{uid:U.uid,role:DEV?'dev':'user',text:t,createdAt:serverTimestamp()})
        .then(()=>{f.input.value='';sOk.disabled=false;
          if(DEV)notify(r.uid,r.id,'Admin membalas: '+t.slice(0,80));else notify('dev',r.id,(r.name||'Pengunjung')+': '+t.slice(0,80));
        }).catch(e=>{sOk.disabled=false;err.textContent='Gagal mengirim: '+(e.code||e.message)});
      return false;
    }});
}
function renderAll(){renderTexts();renderPhoto();renderCover();renderProjects();renderPkgs();renderOpen();renderTesti();renderContacts();renderReq()}

/* editor Dev */
function editText(k){const f=field(LB[k]||'Teks',S.texts[k],ML[k]);openSheet({title:'Ubah teks',body:f,onOk(){S.texts[k]=f.input.value.trim();renderTexts();saveMain()}})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(DEV&&t)editText(t.dataset.k)});
document.addEventListener('keydown',e=>{if(DEV&&e.key==='Enter'&&e.target.dataset&&e.target.dataset.k)editText(e.target.dataset.k)});
function openCard(p,tmp){
  const isNew=!p;
  tmp=tmp||(p?{t:p.t||'',d:p.d||'',h:p.h||'',imgs:imgsOf(p).slice()}:{t:'Judul karya',d:'',h:'',imgs:[]});
  const body=mk('div'),ft=field('Nama karya',tmp.t),fd=field('Keterangan',tmp.d,true),fh=field('Link karya (opsional)',tmp.h,false,'https://...');
  body.append(ft,fd,fh);
  const grab=()=>{tmp.t=ft.input.value.trim()||'Tanpa judul';tmp.d=fd.input.value.trim();tmp.h=fh.input.value.trim()};
  body.appendChild(mk('p','note','Foto karya ('+tmp.imgs.length+' dari 4)'));
  const th=mk('div','row');
  tmp.imgs.forEach((u,i)=>{
    const w=mk('div','thumb'),im=mk('img');im.src=u;im.alt='';
    const x=mk('button','mini','Hapus');x.type='button';x.onclick=()=>{grab();tmp.imgs.splice(i,1);openCard(p,tmp)};
    w.append(im,x);th.appendChild(w);
  });
  body.appendChild(th);
  if(tmp.imgs.length<4){
    const bp=mk('button','mini','Tambah foto karya');bp.type='button';bp.style.marginTop='.6rem';
    bp.onclick=()=>pick(img=>{grab();openCrop(img,4/3,640,'Atur foto karya',url=>{tmp.imgs.push(url);openCard(p,tmp)},{onBack:()=>openCard(p,tmp)})});
    body.appendChild(bp);
  }
  openSheet({title:isNew?'Tambah karya':'Ubah karya',body,noFocus:!isNew,del:!isNew,delLabel:'Hapus karya',
    onOk(){
      grab();
      const data={t:tmp.t,d:tmp.d,h:tmp.h,imgs:tmp.imgs,img:tmp.imgs[0]||''};
      if(JSON.stringify(data).length>900000){toast('Foto terlalu besar. Kurangi jumlah foto.');return false}
      const w=isNew?addDoc(collection(db,'projects'),Object.assign({order:Date.now()},data)):updateDoc(doc(db,'projects',p.id),data);
      w.catch(e=>toast('Gagal menyimpan: '+(e.code||e.message)));
    },
    onDel(){deleteDoc(doc(db,'projects',p.id)).catch(e=>toast('Gagal menghapus: '+(e.code||e.message)))}});
}
function openPkg(g,i){
  const arr=g==='v'?S.vipPackages:g==='q'?S.packages2:S.packages;
  const c=i>=0?arr[i]:{n:'',p:'',t:'',d:''},body=mk('div');
  const fn=field('Nama paket',c.n,false,'Contoh: Basic'),fp=field('Harga',c.p,false,'Contoh: Rp 50.000'),ft=field('Lama pengerjaan',c.t,false,'Contoh: 3 hari'),fd=field('Isi paket',c.d,true);
  body.append(fn,fp,ft,fd);
  openSheet({title:i>=0?'Ubah paket':'Tambah paket',body,del:i>=0,delLabel:'Hapus paket',
    onOk(){const v={n:fn.input.value.trim()||'Paket',p:fp.input.value.trim(),t:ft.input.value.trim(),d:fd.input.value.trim()};if(i>=0)arr[i]=v;else arr.push(v);renderPkgs();saveMain()},
    onDel(){arr.splice(i,1);renderPkgs();saveMain()}});
}
function openTesti(i){
  const c=i>=0?S.testi[i]:{n:'',t:''},body=mk('div'),fn=field('Nama pemberi testimoni',c.n),ft=field('Isi testimoni',c.t,true);
  body.append(fn,ft);
  openSheet({title:i>=0?'Ubah testimoni':'Tambah testimoni',body,del:i>=0,delLabel:'Hapus testimoni',
    onOk(){const v={n:fn.input.value.trim()||'Pelanggan',t:ft.input.value.trim()};if(!v.t)return false;if(i>=0)S.testi[i]=v;else S.testi.push(v);renderTesti();saveMain()},
    onDel(){S.testi.splice(i,1);renderTesti();saveMain()}});
}
function openContact(i){
  const c=i>=0?S.contacts[i]:{l:'',h:'https://'},body=mk('div'),fl=field('Nama tombol',c.l,false,'Contoh: Instagram'),fh=field('Link',c.h,false,'https://...');
  body.append(fl,fh);
  openSheet({title:i>=0?'Ubah kontak':'Tambah kontak',body,del:i>=0,delLabel:'Hapus kontak',
    onOk(){const v={l:fl.input.value.trim()||'Link',h:fh.input.value.trim()};if(i>=0)S.contacts[i]=v;else S.contacts.push(v);renderContacts();saveMain()},
    onDel(){S.contacts.splice(i,1);renderContacts();saveMain()}});
}
$('avatar').onclick=()=>{if(!DEV)return;pick(img=>openCrop(img,1,360,'Atur foto profil',url=>{S.photo=url;renderPhoto();saveMain()},{onDel:S.photo?()=>{S.photo='';renderPhoto();saveMain()}:null}))};
$('cover').onclick=()=>{if(!DEV)return;pick(img=>openCrop(img,16/7,1200,'Atur foto sampul',url=>{S.cover=url;renderCover();saveMain()},{onDel:S.cover?()=>{S.cover='';renderCover();saveMain()}:null}))};
$('addProj').onclick=()=>openCard(null);
$('addCont').onclick=()=>openContact(-1);

/* VIP */
function waNum(){let d=(S.texts.vipWa||'').replace(/\D/g,'');if(d.indexOf('0')===0)d='62'+d.slice(1);return d.length>=8?d:''}
$('vipSet').onclick=()=>{const f=field('Nomor WhatsApp untuk bukti pembayaran',S.texts.vipWa,false,'Contoh: 08123456789');openSheet({title:'Atur nomor WhatsApp',body:f,onOk(){S.texts.vipWa=f.input.value.trim();saveMain()}})};
function vipDone(text){
  const body=mk('div');
  body.append(mk('p','note','Request kamu sudah tercatat. Lakukan pembayaran sesuai info di halaman, lalu kirim bukti transfer ke WhatsApp supaya cepat diproses.'));
  const wa=waNum();
  openSheet({title:'Request terkirim',body,ok:wa?'Kirim bukti via WhatsApp':'Selesai',cancelLabel:'Tutup',noFocus:true,
    onOk(){if(wa)window.open('https://wa.me/'+wa+'?text='+encodeURIComponent('Halo, saya '+(U.displayName||'pengunjung')+'. Saya sudah kirim request VIP: '+text+'\nBukti pembayaran menyusul.'),'_blank','noopener')}});
}
function openVip(pi,vip){
  if(S.open===false&&!DEV){toast('Request sedang ditutup. Silakan cek lagi nanti.');return}
  if(!U){
    openSheet({title:'Request VIP',body:mk('p','note','Masuk dulu dengan Google supaya request-mu tercatat dan statusnya bisa kamu pantau.'),ok:'Masuk dengan Google',noFocus:true,onOk(){login()}});
    return;
  }
  if(!DEV){
    const act=REQ.filter(r=>(r.status||'baru')!=='selesai').length;
    if(act>=3){toast('Kamu masih punya 3 request yang belum selesai. Tunggu salah satunya selesai dulu.');return}
  }
  const body=mk('div'),fn=field('Nama kamu',U.displayName||''),fr=field('Request kamu','',true,'Tulis karya atau layanan yang kamu mau'),err=mk('p','err','');
  const sw=mk('label','fl'),sel=document.createElement('select');
  const addGroup=(label,arr,g)=>{if(!arr.length)return;const og=document.createElement('optgroup');og.label=label;arr.forEach((p,i)=>{const o=mk('option','',p.n+' · '+p.p);o.value=g+i;og.appendChild(o)});sel.appendChild(og)};
  if(vip){addGroup(S.texts.vipPkH||'Paket VIP',S.vipPackages,'v')}else{addGroup('Paket utama',S.packages,'p');addGroup(S.texts.pk2H||'Paket baru',S.packages2,'q')}
  const o2=mk('option','','Belum tahu, diskusi dulu');o2.value='-1';sel.appendChild(o2);
  const all=vip?S.vipPackages.map((_,i)=>'v'+i):[...S.packages.map((_,i)=>'p'+i),...S.packages2.map((_,i)=>'q'+i)];
  sel.value=(typeof pi==='string'&&all.includes(pi))?pi:(all.length?all[0]:'-1');
  sw.append(mk('span','','Pilih paket'),sel);
  body.append(fn,sw,fr);
  const needTerms=!!(S.texts.terms||'').trim();let ck=null;
  if(needTerms){
    ck=document.createElement('input');ck.type='checkbox';
    const cl=mk('label','note');cl.style.display='flex';cl.style.gap='.5rem';cl.style.alignItems='flex-start';
    cl.append(ck,document.createTextNode('Saya sudah membaca dan setuju dengan syarat dan ketentuan di halaman ini.'));
    body.appendChild(cl);
  }
  if(!all.length&&S.texts.vipP)body.appendChild(mk('p','note','Harga: '+S.texts.vipP));
  body.appendChild(err);
  openSheet({title:'Request VIP',body,ok:'Kirim request',
    onOk(){
      const text=fr.input.value.trim(),name=fn.input.value.trim()||U.displayName||'Pengunjung';
      if(!text){err.textContent='Tulis dulu request kamu.';return false}
      if(text.length>1000){err.textContent='Request terlalu panjang (maksimal 1000 huruf).';return false}
      if(ck&&!ck.checked){err.textContent='Centang persetujuan syarat dan ketentuan dulu.';return false}
      const sv=sel.value,pk=sv==='-1'?null:(sv[0]==='v'?S.vipPackages:sv[0]==='q'?S.packages2:S.packages)[+sv.slice(1)],pkg=pk?(pk.n+' · '+pk.p).slice(0,80):'';
      const data={uid:U.uid,name:name.slice(0,80),email:U.email||'',text,status:'baru',createdAt:serverTimestamp()};
      if(pkg)data.pkg=pkg;
      sOk.disabled=true;
      addDoc(collection(db,'requests'),data)
        .then(ref=>{notify('dev',ref.id,'Request baru dari '+name+(pkg?' ('+pkg+')':'')+': '+text.slice(0,80));vipDone(text)})
        .catch(e=>{sOk.disabled=false;err.textContent='Gagal mengirim: '+(e.code||e.message)});
      return false;
    }});
}
$('vipBtn').onclick=()=>openVip(undefined,true);
$('openToggle').onclick=()=>{S.open=(S.open===false);renderOpen();renderPkgs();saveMain()};
$('addPkg').onclick=()=>openPkg('p',-1);
$('addPkg2').onclick=()=>openPkg('q',-1);
$('addVipPkg').onclick=()=>openPkg('v',-1);
$('addTesti').onclick=()=>openTesti(-1);
renderAll();
</script>
